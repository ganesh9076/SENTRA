<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us — SENTRA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Integrating SENTRA UI Colors */
        :root {
            --bg: #111416;
            --bg2: #181c20;
            --accent: #3b82f6;
            --text: #e2e8f0;
            --text2: #8a9ab0;
            --border: #2a3040;
        }

        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        /* ── ANIMATED HEADER SECTION (Restored from previous project) ── */
        .section-title {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 4rem;
            padding-top: 2rem;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
            padding: 0.5rem 2rem;
        }

        .title-wrapper::before,
        .title-wrapper::after {
            content: '{ }';
            position: absolute;
            font-size: 2.5rem;
            color: var(--accent);
            opacity: 0.6;
            animation: pulse 2s infinite;
            font-family: 'DM Mono', monospace;
        }

        .title-wrapper::before { left: -1.5rem; }
        .title-wrapper::after { right: -1.5rem; }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .title-text {
            font-size: 3.5rem;
            letter-spacing: -1px;
            /* SENTRA colored gradient: White to Blue to Purpleish */
            background: linear-gradient(45deg, #ffffff, var(--accent), #9333ea);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% 200%;
            animation: gradientMove 5s ease infinite;
            text-transform: uppercase;
            font-weight: 800;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── CARD STYLES ── */
        .card {
            transition: all 0.5s ease;
            padding: 2.5rem;
            width: 300px;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            background: var(--bg2);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            transition: 0.5s;
        }

        .card:hover::before { left: 100%; }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--accent);
        }

        .card img {
            transition: transform 0.5s ease;
            border: 4px solid var(--accent);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .card:hover img { transform: scale(1.05); }

        .member-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1.5rem 0 0.5rem 0;
            color: #fff;
        }

        .role-tag {
            color: var(--accent);
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            display: block;
        }

        .social-icon {
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text2);
        }

        .social-icon:hover {
            transform: translateY(-5px);
            background: var(--accent);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container mx-auto py-12 px-4">
        
        <div class="section-title">
            <div class="title-wrapper">
                <h1 class="title-text">Meet Our Team</h1>
            </div>
            <p style="color: var(--text2);" class="mt-4 max-w-2xl">
                Driving innovation in Threat Intelligence and Blockchain Security
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 justify-items-center">
            
            <div class="card rounded-2xl text-center">
                <img src="images/ganeshimg.jpeg" alt="Ganesh Palav" class="w-44 h-48 rounded-full mx-auto object-cover">
                <h2 class="member-name">Ganesh Palav</h2>
                <span class="role-tag">Lead Developer</span>
                <div class="flex justify-center gap-4">
                    <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="card rounded-2xl text-center">
                <img src="images/FinalAditya.jpeg" alt="Aditya Bankar" class="w-44 h-48 rounded-full mx-auto object-cover">
                <h2 class="member-name">Aditya Bankar</h2>
                <span class="role-tag">Security Analyst</span>
                <div class="flex justify-center gap-4">
                    <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="card rounded-2xl text-center">
                <img src="images\adityaGupta.jpeg" alt="Aditya Gupta" class="w-44 h-48 rounded-full mx-auto object-cover">
                <h2 class="member-name">Aditya Gupta</h2>
                <span class="role-tag">Blockchain Expert</span>
                <div class="flex justify-center gap-4">
                    <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="card rounded-2xl text-center">
                <img src="images/pratikimg.jpeg" alt="Pratik Jingare" class="w-44 h-48 rounded-full mx-auto object-cover">
                <h2 class="member-name">Pratik Jingare</h2>
                <span class="role-tag">UI/UX Researcher</span>
                <div class="flex justify-center gap-4">
                    <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#" class="social-icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
